[project]
name = "reto-03-oc-sap"
version = "1.0.0"
description = "Agente conversacional de Órdenes de Compra SAP — Periferia IT Group"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",      # valida argumentos de herramientas (sustituye a zod, ADR-001)
    "openai>=1.54",       # SDK del proveedor LLM
    "fastapi>=0.115",     # API del chat
    "uvicorn>=0.32",      # servidor ASGI
    "streamlit>=1.40",    # front de chat
    "httpx>=0.27",        # cliente HTTP del front hacia la API
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# `disallow_any_explicit` está deliberadamente desactivado: ver ADR-009.
# `strict` ya prohíbe el Any implícito, que es el peligroso. El Any explícito
# solo aparece en la frontera de deserialización de JSON, donde la forma del
# dato se desconoce por definición hasta que Pydantic la valida.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

# Las reglas se declaran explícitamente para que el lint sea reproducible en
# otra máquina: sin esto, ruff usa su default (E4,E7,E9,F) y cualquier config
# de usuario fuera del repositorio produce un resultado distinto.
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # errores, pyflakes, orden de imports, sintaxis moderna

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
